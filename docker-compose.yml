services:
  jellylens:
    build: ./nextapp
    image: jellylens:latest
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-en-US}
      LIBRARY_SCAN_INTERVAL_HOURS: ${LIBRARY_SCAN_INTERVAL_HOURS:-6}
      TMDB_SYNC_INTERVAL_HOURS: ${TMDB_SYNC_INTERVAL_HOURS:-24}
      MISSING_RECHECK_INTERVAL_HOURS: ${MISSING_RECHECK_INTERVAL_HOURS:-24}
      XREL_SYNC_INTERVAL_HOURS: ${XREL_SYNC_INTERVAL_HOURS:-6}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      WCX_URL: ${WCX_URL:-}
      WCX_API_URL: ${WCX_API_URL:-}
      DDOWNLOAD_LOGIN: ${DDOWNLOAD_LOGIN:-}
      DDOWNLOAD_PASSWORD: ${DDOWNLOAD_PASSWORD:-}
      REALDEBRID_TOKEN: ${REALDEBRID_TOKEN:-}
      ARCHIVE_PASSWORDS: ${ARCHIVE_PASSWORDS:-}
      # Downloads go to /downloads: ./downloads next to this file, or the host
      # folder DOWNLOADS_PATH names (e.g. next to the media library).
      DOWNLOAD_DIR: /downloads
      # The library's disks, one folder per disk with movies/ and shows/:
      # what the library scan reads and Organize moves into; mount them in a
      # compose override (see the README).
      LIBRARY_DIR: ${LIBRARY_DIR:-}
      DATA_DIR: /app/data
    volumes:
      - cache_data:/app/data
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
      - "8091:3000"
    restart: unless-stopped

volumes:
  cache_data:
